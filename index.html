<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸 | 每日一图，带你领略世界之美</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --bg-primary: #0d0d1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #1a1a2e;
            --text-primary: #fff;
            --text-secondary: rgba(255,255,255,0.5);
            --text-muted: rgba(255,255,255,0.25);
            --text-faint: rgba(255,255,255,0.12);
            --border-color: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --nav-bg: rgba(13,13,26,0.92);
            --pagination-bg: rgba(13,13,26,0.85);
            --shadow-color: rgba(0,0,0,0.5);
            --overlay-bg: rgba(0,0,0,0.92);
            --card-bg: #1a1a2e;
            --input-bg: rgba(255,255,255,0.05);
            --input-border: rgba(255,255,255,0.06);
            --btn-hover: rgba(255,255,255,0.08);
            --scrollbar-thumb: rgba(255,255,255,0.15);
            --scrollbar-thumb-hover: rgba(255,255,255,0.25);
            --progress-bar: linear-gradient(90deg, #4fc3f7, #00e5ff);
            --accent-color: #4fc3f7;
            --accent-hover: rgba(79,195,247,0.2);
            --detail-panel-bg: #1a1a2e;
            --arrow-bg-hover: rgba(255,255,255,0.08);
            --arrow-color: rgba(255,255,255,0.2);
            --arrow-color-hover: rgba(255,255,255,0.8);
            --btn-bg: rgba(0,0,0,0.4);
            --btn-border: rgba(255,255,255,0.08);
            --btn-color: rgba(255,255,255,0.7);
            --btn-hover-bg: rgba(0,0,0,0.6);
            --btn-hover-color: rgba(255,255,255,0.9);
            --meta-color: rgba(255,255,255,0.7);
            --meta-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.4);
            --resolution-bg: #1a1a2e;
            --detail-panel-bg: #1a1a2e;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.10);
            --glass-hover: rgba(255, 255, 255, 0.14);
            --red-btn-bg: rgba(220, 60, 60, 0.85);
            --red-btn-hover: rgba(200, 40, 40, 0.95);
            --red-btn-text: #fff;
            --red-btn-shadow: rgba(220, 60, 60, 0.25);
            --donate-bg: rgba(20, 22, 36, 0.40);
            --donate-border: rgba(255, 255, 255, 0.08);
            --nav-modern-bg: rgba(13, 13, 26, 0.6);
            --nav-modern-border: rgba(255, 255, 255, 0.08);
            --nav-modern-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            --nav-search-bg: rgba(255, 255, 255, 0.06);
            --nav-search-border: rgba(255, 255, 255, 0.06);
            --nav-search-focus: rgba(79, 195, 247, 0.1);
            --nav-link-hover: rgba(255, 255, 255, 0.06);
            --nav-mobile-border: rgba(255, 255, 255, 0.06);
        }
        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0,0,0,0.5);
            --text-muted: rgba(0,0,0,0.25);
            --text-faint: rgba(0,0,0,0.1);
            --border-color: rgba(0,0,0,0.06);
            --border-hover: rgba(0,0,0,0.12);
            --nav-bg: rgba(255,255,255,0.92);
            --pagination-bg: rgba(255,255,255,0.85);
            --shadow-color: rgba(0,0,0,0.08);
            --overlay-bg: rgba(255,255,255,0.95);
            --card-bg: #ffffff;
            --input-bg: rgba(0,0,0,0.04);
            --input-border: rgba(0,0,0,0.08);
            --btn-hover: rgba(0,0,0,0.06);
            --scrollbar-thumb: rgba(0,0,0,0.15);
            --scrollbar-thumb-hover: rgba(0,0,0,0.25);
            --detail-panel-bg: #ffffff;
            --arrow-bg-hover: rgba(0,0,0,0.06);
            --arrow-color: rgba(0,0,0,0.15);
            --arrow-color-hover: rgba(0,0,0,0.5);
            --btn-bg: rgba(255,255,255,0.6);
            --btn-border: rgba(0,0,0,0.06);
            --btn-color: rgba(0,0,0,0.6);
            --btn-hover-bg: rgba(255,255,255,0.9);
            --btn-hover-color: rgba(0,0,0,0.85);
            --meta-color: rgba(0,0,0,0.7);
            --meta-shadow: 0 2px 20px rgba(255,255,255,0.9), 0 0 40px rgba(255,255,255,0.4);
            --resolution-bg: #ffffff;
            --detail-panel-bg: #ffffff;
            --glass-bg: rgba(0, 0, 0, 0.04);
            --glass-border: rgba(0, 0, 0, 0.06);
            --glass-hover: rgba(0, 0, 0, 0.10);
            --red-btn-bg: rgba(220, 60, 60, 0.75);
            --red-btn-hover: rgba(200, 40, 40, 0.9);
            --red-btn-text: #fff;
            --red-btn-shadow: rgba(220, 60, 60, 0.2);
            --donate-bg: rgba(255, 255, 255, 0.95);
            --donate-border: rgba(0, 0, 0, 0.08);
            --nav-modern-bg: rgba(255, 255, 255, 0.7);
            --nav-modern-border: rgba(0, 0, 0, 0.06);
            --nav-modern-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
            --nav-search-bg: rgba(0, 0, 0, 0.04);
            --nav-search-border: rgba(0, 0, 0, 0.06);
            --nav-search-focus: rgba(79, 195, 247, 0.1);
            --nav-link-hover: rgba(0, 0, 0, 0.04);
            --nav-mobile-border: rgba(0, 0, 0, 0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%; 
            background: var(--bg-primary); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            overflow: hidden; 
            transition: background 0.3s ease, color 0.3s ease; 
            color: var(--text-primary); 
            -webkit-tap-highlight-color: transparent !important;
        }
        #progress-bar { position: fixed; top: 0; left: 0; height: 2.5px; background: var(--progress-bar); width: 0%; z-index: 9999; transition: width 0.3s ease; box-shadow: 0 0 12px rgba(79,195,247,0.4); }

        /* ============================================================
           ★★★ 导航栏 - 默认隐藏，悬停显示 ★★★
           ============================================================ */
        .navbar-modern {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            z-index: 1000;
            width: calc(100% - 32px);
            max-width: 1200px;
            background: rgba(13, 13, 26, 0.0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 10px 20px;
            box-shadow: none;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        .navbar-modern.visible {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            background: var(--nav-modern-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--nav-modern-border);
            box-shadow: var(--nav-modern-shadow);
        }
        [data-theme="light"] .navbar-modern.visible {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.06);
        }

        .navbar-modern-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
        }

        /* ---- 左侧：Logo + 统计 ---- */
        .nav-left {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            gap: 10px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }
        .nav-logo {
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }
        .nav-brand-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .nav-brand-text span {
            color: var(--accent-color);
            font-weight: 700;
        }

        /* ★★★ 壁纸统计 ★★★ */
        .nav-badge {
            font-size: 12px;
            color: var(--text-muted);
            padding: 2px 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
            transition: all 0.3s ease;
            display: inline-block;
        }
        [data-theme="light"] .nav-badge {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.04);
        }

        .nav-center {
            flex: 1;
            max-width: 480px;
            min-width: 120px;
        }
        .nav-search {
            display: flex;
            align-items: center;
            background: var(--nav-search-bg);
            border: 1px solid var(--nav-search-border);
            border-radius: 12px;
            padding: 0 12px;
            transition: all 0.3s ease;
        }
        .nav-search:focus-within {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px var(--nav-search-focus);
        }
        .nav-search .search-icon {
            color: var(--text-muted);
            font-size: 14px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .nav-search input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 8px 0;
            min-width: 60px;
        }
        .nav-search input::placeholder {
            color: var(--text-muted);
        }
        .nav-search .search-clear {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            display: none;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .nav-search .search-clear:hover {
            color: var(--text-primary);
        }
        .nav-search .search-clear.visible {
            display: block;
        }
        .nav-search .search-btn {
            background: var(--accent-color);
            border: none;
            color: #0d0d1a;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-search .search-btn:hover {
            opacity: 0.8;
            transform: scale(0.96);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
            position: relative;
        }
        .nav-link:hover {
            background: var(--nav-link-hover);
            color: var(--text-primary);
        }
        .nav-link .badge-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            background: #ff6b6b;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        .nav-link i {
            font-size: 15px;
        }
        .nav-link span {
            display: inline;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        [data-theme="light"] .theme-toggle {
            background: rgba(0, 0, 0, 0.04);
        }
        [data-theme="light"] .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        .nav-toggle-mobile {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
        }
        .nav-toggle-mobile:hover {
            background: var(--nav-link-hover);
        }

        .nav-mobile-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--nav-mobile-border);
        }
        .nav-mobile-menu.open {
            display: flex;
        }
        .nav-mobile-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
            text-align: left;
        }
        .nav-mobile-link:hover {
            background: var(--nav-link-hover);
            color: var(--text-primary);
        }
        .nav-mobile-link i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* ============================================================
           主体内容
           ============================================================ */
        .app { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            height: 100vh; 
            height: 100dvh;
            padding: 0; 
            overflow: hidden; 
            background: var(--bg-primary);
        }
        .grid { 
            display: flex;
            flex-wrap: wrap;
            flex: 1;
            padding: 0 0 0 0;
            overflow-y: auto; 
            min-height: 0;
            background: var(--bg-primary);
            align-content: flex-start;
            gap: 0;
        }
        .grid::-webkit-scrollbar { width: 6px; }
        .grid::-webkit-scrollbar-track { 
            background: rgba(255,255,255,0.04); 
            border-radius: 3px;
        }
        .grid::-webkit-scrollbar-thumb { 
            background: var(--accent-color); 
            border-radius: 3px;
            transition: 0.3s;
        }
        .grid::-webkit-scrollbar-thumb:hover { 
            background: #81d4fa; 
        }

        .card {
            position: relative;
            overflow: hidden;
            background: var(--bg-card);
            flex: 0 0 20%;
            aspect-ratio: 16 / 9;
            cursor: zoom-in;
            transition: background 0.3s ease, border-color 0.3s ease;
            contain: strict;
            -webkit-tap-highlight-color: transparent;
            border-radius: 0;
            min-height: 0;
            border: 3px solid transparent;
        }
        .card:hover {
            border-color: #d63031;
            z-index: 1;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1);
            background: var(--bg-card);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .card img.loaded { opacity: 1; }
        .card:hover img { transform: scale(1.05); }

        .card .placeholder-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.7);
            transform: scale(1.04);
            transition: opacity 0.6s ease;
            z-index: 1;
            background-color: var(--bg-card);
        }

        .card .placeholder-bg.hidden { opacity: 0; }

        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 14px 12px 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .card:hover .info { opacity: 1; }
        .card .info .date { font-size: 15px; color: rgba(255,255,255,0.8); font-weight: 600; }
        .card .info .title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card .info .copyright { font-size: 11px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .loading-indicator {
            flex: 0 0 100%;
            text-align: center;
            padding: 20px 0 30px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .loading-indicator i {
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-end {
            flex: 0 0 100%;
            text-align: center;
            padding: 30px 20px 40px;
            color: var(--text-faint);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
        .footer-end .footer-line { width: 60px; height: 1px; background: var(--text-faint); border: none; margin: 0 auto; }
        .footer-end .footer-icon { font-size: 24px; color: var(--text-faint); opacity: 0.5; }
        .footer-end .footer-text { color: var(--text-muted); font-size: 13px; letter-spacing: 0.5px; }
        .footer-end .footer-text span { color: var(--accent-color); opacity: 0.6; }
        .footer-end .footer-sub { color: var(--text-faint); font-size: 11px; margin-top: 2px; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-to-top {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 100;
            background: var(--pagination-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: none;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .back-to-top:hover {
            background: var(--accent-hover);
            border-color: var(--accent-color);
            transform: scale(1.05);
        }
        .back-to-top.visible {
            display: flex;
        }

        .empty {
            flex: 0 0 100%;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .empty .icon { font-size: 40px; margin-bottom: 10px; }

        /* ============================================================
           大图预览
           ============================================================ */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            background: transparent;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }
        .preview-overlay.active { display: flex; }

        .preview-overlay::before {
            content: '';
            position: fixed;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: center/cover no-repeat;
            filter: blur(30px) brightness(0.3);
            z-index: -1;
            transform: scale(1.1);
            transition: background-image 0.4s ease;
        }

        .preview-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .preview-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
            pointer-events: auto;
            cursor: pointer;
            z-index: 5;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            opacity: 1;
            transition: none;
        }
        .preview-image.loading {
            opacity: 1;
        }

        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.7);
            font-size: 28px;
            padding: 18px 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 12px;
            z-index: 10;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            user-select: none;
            line-height: 1;
        }
        .arrow:focus { outline: none !important; box-shadow: none !important; }
        .arrow:hover { 
            color: #fff; 
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-50%) scale(1.04);
        }
        .arrow:active { transform: translateY(-50%) scale(0.94); }
        .arrow-left { left: 20px; }
        .arrow-right { right: 20px; }

        .toolbar {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: flex-end;
            transition: opacity 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

                        <div class="qr-item"><img src="https://img.hangdn.com/hd/wechat.png" alt="微信支付" /><span class="qr-label wechat"><i class="fab fa-weixin"></i> 微信支付</span></div>
                        <div class="qr-item"><img src="https://img.hangdn.com/hd/alipay.png" alt="支付宝" /><span class="qr-label alipay"><i class="fab fa-alipay"></i> 支付宝</span></div>
                    </div>
                    <div class="qr-footer"><i class="fas fa-mug-hot"></i> 您的支持是我持续更新的动力</div>
                </div>
            </div>
            <button class="btn" id="closePreviewBtn"><i class="fas fa-times"></i></button>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="copyright" id="previewCopyright"></div>
            <div class="date" id="previewDate"></div>
            <div class="desc" id="previewDesc"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.41/dist/twikoo.min.js"></script>
    <script>
        (function() {
            function getBasePath() {
                var path = window.location.pathname;
                if (path.endsWith('.html')) return path.substring(0, path.lastIndexOf('/'));
                return path.replace(/\/$/, '');
            }
            var BASE_PATH = getBasePath();

            // ---- 主题 ----
            var themeToggle = document.getElementById('themeToggle');
            var themeToggleMobile = document.getElementById('themeToggleMobile');
            var currentTheme = localStorage.getItem('theme') || 'dark';

            function setTheme(theme) {
                currentTheme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                var icon = theme === 'dark' ? 'fa-moon' : 'fa-sun';
                if (themeToggle) themeToggle.innerHTML = '<i class="fas ' + icon + '"></i>';
                if (themeToggleMobile) themeToggleMobile.innerHTML = '<i class="fas ' + icon + '"></i> 切换主题';
            }
            function toggleThemeHandler() { setTheme(currentTheme === 'dark' ? 'light' : 'dark'); }
            if (themeToggle) themeToggle.addEventListener('click', toggleThemeHandler);
            if (themeToggleMobile) themeToggleMobile.addEventListener('click', toggleThemeHandler);
            setTheme(currentTheme);

            // ---- DOM ----
            var grid = document.getElementById('grid');
            var previewOverlay = document.getElementById('previewOverlay');
            var previewImg = document.getElementById('previewImg');
            var previewCopyright = document.getElementById('previewCopyright');
            var previewDate = document.getElementById('previewDate');
            var previewDesc = document.getElementById('previewDesc');
            var totalNavCount = document.getElementById('totalNavCount');
            var navBadge = document.getElementById('navBadge');
            var searchInput = document.getElementById('searchInput');
            var searchBtn = document.getElementById('searchBtn');
            var searchClear = document.getElementById('searchClear');
            var closePreviewBtn = document.getElementById('closePreviewBtn');
            var prevBtn = document.getElementById('prevPreviewBtn');
            var nextBtn = document.getElementById('nextPreviewBtn');
            var backToTop = document.getElementById('backToTop');
            var commentOverlay = document.getElementById('commentOverlay');
            var closeCommentBtn = document.getElementById('closeCommentBtn');
            var commentNavBtn = document.getElementById('commentNavBtn');
            var commentNavBtnMobile = document.getElementById('commentNavBtnMobile');
            var toolbar = document.getElementById('toolbar');
            var infoPanel = document.getElementById('infoPanel');

            // ---- ★★★ 导航栏悬停显示 ★★★ ----
            var navbarModern = document.getElementById('navbar');
            var hoverTimer = null;
            var isNavVisible = false;

            function showNav() {
                navbarModern.classList.add('visible');
                isNavVisible = true;
                clearTimeout(hoverTimer);
            }

            function hideNav() {
                if (!isNavVisible) return;
                hoverTimer = setTimeout(function() {
                    navbarModern.classList.remove('visible');
                    isNavVisible = false;
                }, 500);
            }

            document.addEventListener('mousemove', function(e) {
                if (e.clientY < 80) {
                    showNav();
                }
            });

            navbarModern.addEventListener('mouseenter', showNav);
            navbarModern.addEventListener('mouseleave', hideNav);

            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'b') {
                    e.preventDefault();
                    if (isNavVisible) {
                        navbarModern.classList.remove('visible');
                        isNavVisible = false;
                    } else {
                        showNav();
                    }
                }
            });

            document.addEventListener('click', function(e) {
                if (isNavVisible && !navbarModern.contains(e.target)) {
                    if (e.clientY < 100) return;
                    hideNav();
                }
            });

            // ---- 移动端菜单 ----
            var navToggleMobile = document.getElementById('navToggleMobile');
            var navMobileMenu = document.getElementById('navMobileMenu');

            if (navToggleMobile && navMobileMenu) {
                navToggleMobile.addEventListener('click', function(e) {
                    e.stopPropagation();
                    navMobileMenu.classList.toggle('open');
                });
                document.querySelectorAll('.nav-mobile-link').forEach(function(item) {
                    item.addEventListener('click', function() {
                        navMobileMenu.classList.remove('open');
                    });
                });
                document.addEventListener('click', function(e) {
                    if (navMobileMenu && !navMobileMenu.contains(e.target) && e.target !== navToggleMobile) {
                        navMobileMenu.classList.remove('open');
                    }
                });
            }

            // ---- 数据 ----
            var allData = [];
            var filteredData = [];
            var currentPage = 1;
            var PAGE_SIZE = 30;
            var totalPages = 1;
            var isLoading = false;
            var hasMore = true;
            var currentPreviewIndex = 0;
            var currentPreviewItem = null;
            var toolbarVisible = true;

            // ---- 进度条 ----
            var progressBar = document.getElementById('progress-bar');
            function showProgress() { progressBar.style.width = '30%'; setTimeout(function() { progressBar.style.width = '60%'; }, 150); }
            function hideProgress() { progressBar.style.width = '100%'; setTimeout(function() { progressBar.style.width = '0%'; }, 350); }

            // ---- 评论 ----
            function openComment() {
                commentOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                if (!document.getElementById('tcomment').hasChildNodes()) initTwikoo();
            }
            function closeComment() {
                commentOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
            function initTwikoo() {
                if (typeof twikoo === 'undefined') { setTimeout(initTwikoo, 500); return; }
                twikoo.init({ envId: 'https://twikoo.hangdn.net', el: '#tcomment', lang: 'zh-CN' });
            }
            if (commentNavBtn) commentNavBtn.addEventListener('click', function(e) { e.stopPropagation(); openComment(); });
            if (commentNavBtnMobile) commentNavBtnMobile.addEventListener('click', function(e) { e.stopPropagation(); openComment(); });
            if (closeCommentBtn) closeCommentBtn.addEventListener('click', closeComment);
            if (commentOverlay) commentOverlay.addEventListener('click', function(e) { if (e.target === commentOverlay) closeComment(); });
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && commentOverlay.classList.contains('active')) closeComment(); });

            // ---- 判断数据类型 ----
            function isHistoryData(item) {
                if (!item) return false;
                if (item.isHistory) return true;
                var url = item.urlbase || '';
                if (url.includes('/originals/')) return true;
                if (url.startsWith('http') && !url.includes('bing.com')) return true;
                if (url.startsWith('/originals/')) return true;
                var date = item.date || '';
                if (date && date.startsWith('201')) {
                    if (!url.includes('th?id=')) return true;
                }
                return false;
            }

            function getImageUrl(item, resolution) {
    if (!item) return '';
    
    // ★★★ 如果数据里有完整的 jpg 链接（来自 data.json），直接用 ★★★
    if (item.jpg) {
        var baseUrl = item.jpg.replace('_UHD.jpg', '').replace('_1920x1080.jpg', '');
        var resMap = {
            '4k': '_UHD.jpg',
            'fhd': '_1920x1080.jpg',
            'hd': '_1920x1200.jpg',
            'mobile': '_1080x1920.jpg',
            'mobile_s': '_768x1280.jpg',
            'thumb': '_400x240.jpg'
        };
        var suffix = resMap[resolution] || '_1920x1080.jpg';
        return baseUrl + suffix;
    }
    
    // ★★★ 兼容旧格式（有 urlbase） ★★★
    if (item.urlbase) {
        if (isHistoryData(item)) {
            return item.urlbase || item.thumb || '';
        }
        var baseUrl = 'https://www.bing.com' + item.urlbase;
        var resMap = {
            '4k': '_UHD.jpg',
            'fhd': '_1920x1080.jpg',
            'hd': '_1920x1200.jpg',
            'mobile': '_1080x1920.jpg',
            'mobile_s': '_768x1280.jpg',
            'thumb': '_400x240.jpg'
        };
        var suffix = resMap[resolution] || '_1920x1080.jpg';
        return baseUrl + suffix;
    }
    
    return '';
}

            // ---- ★★★ 加载数据 - 改为读取 /data/data.json ★★★ ----
            async function loadData() {
                showProgress();
                try {
                    // ★★★ 数据源改为 /data/data.json ★★★
                    var url = BASE_PATH + '/data/data.json';
                    var res = await fetch(url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    var rawData = await res.json();
                    if (!Array.isArray(rawData) || rawData.length === 0) { showEmpty(); hideProgress(); return; }
                    
                    // ★★★ 数据已经是目标格式，直接使用 ★★★
                    allData = rawData.map(function(item) {
                        // 处理可能存在的 startdate 字段（兼容性）
                        var dateStr = item.date || item.startdate || '';
                        var formattedDate = dateStr;
                        // 如果是 8 位数字格式，转为 YYYY-MM-DD
                        if (/^\d{8}$/.test(dateStr)) {
                            formattedDate = dateStr.slice(0,4) + '-' + dateStr.slice(4,6) + '-' + dateStr.slice(6,8);
                        }
                        return {
                            date: formattedDate,
                            copyright: item.copyright || item.title || '',
                            title: item.copyright || item.title || '',
                            urlbase: item.urlbase || '',
                            isHistory: isHistoryData(item),
                            urls: {
                                uhd: item.jpg || '',
                                fhd: item.jpg || '',
                                hd: item.jpg || '',
                                mobile: item.jpg || '',
                                mobile_s: item.jpg || '',
                                thumb: item.thumb || item.jpg || ''
                            }
                        };
                    });
                    
                    allData.sort(function(a, b) { return b.date.localeCompare(a.date); });
                    filteredData = [];
                    if (totalNavCount) totalNavCount.textContent = allData.length;
                    if (navBadge) navBadge.textContent = allData.length + ' 张';
                    totalPages = Math.ceil(allData.length / PAGE_SIZE);
                    currentPage = 1;
                    hasMore = true;
                    grid.innerHTML = '';
                    renderPage(1);
                    hideProgress();
                } catch (err) { 
                    console.error('加载失败:', err); 
                    showEmpty(); 
                    hideProgress(); 
                }
            }

            function renderPage(page) {
                var data = filteredData.length > 0 ? filteredData : allData;
                totalPages = Math.ceil(data.length / PAGE_SIZE);
                if (page < 1) page = 1;
                if (page > totalPages) { hasMore = false; showFooterEnd(); return; }
                currentPage = page;
                var start = (page - 1) * PAGE_SIZE;
                var end = Math.min(start + PAGE_SIZE, data.length);
                var items = data.slice(start, end);
                if (items.length === 0) { hasMore = false; showFooterEnd(); return; }
                var loadingEl = document.querySelector('.loading-indicator');
                if (loadingEl) loadingEl.remove();
                var footerEl = document.querySelector('.footer-end');
                if (footerEl) footerEl.remove();
                items.forEach(function(item) {
                    var card = document.createElement('div');
                    card.className = 'card';
                    var thumbSrc = item.urls.thumb || '';
                    card.innerHTML = '<div class="placeholder-bg" style="background-image: url(' + thumbSrc + ');"></div><img src="' + thumbSrc + '" alt="' + (item.copyright || item.date) + '" loading="lazy" crossorigin="anonymous" /><div class="info"><div class="date">' + item.date + '</div><div class="title">' + (item.title || item.copyright || '无标题') + '</div><div class="copyright">' + (item.copyright || '') + '</div></div>';
                    var img = card.querySelector('img');
                    var placeholderBg = card.querySelector('.placeholder-bg');
                    img.addEventListener('load', function() { img.classList.add('loaded'); placeholderBg.classList.add('hidden'); });
                    if (img.complete) { img.classList.add('loaded'); placeholderBg.classList.add('hidden'); }
                    img.addEventListener('error', function() {
                        if (this.src === item.urls.thumb && item.urls.fhd) { this.src = item.urls.fhd; return; }
                        this.classList.add('loaded');
                        placeholderBg.classList.add('hidden');
                    });
                    card.addEventListener('click', function() {
                        var targetIndex = -1;
                        for (var i = 0; i < allData.length; i++) { if (allData[i].date === item.date) { targetIndex = i; break; } }
                        if (targetIndex === -1) return;
                        openPreview(targetIndex);
                    });
                    grid.appendChild(card);
                });
                if (page < totalPages) {
                    var loadingDiv = document.createElement('div');
                    loadingDiv.className = 'loading-indicator';
                    loadingDiv.id = 'loadingIndicator';
                    loadingDiv.innerHTML = '<i class="fas fa-spinner"></i> 加载更多...';
                    grid.appendChild(loadingDiv);
                } else {
                    hasMore = false;
                    showFooterEnd();
                }
                isLoading = false;
            }

            function showFooterEnd() {
                var oldFooter = document.querySelector('.footer-end');
                if (oldFooter) oldFooter.remove();
                var loadingEl = document.querySelector('.loading-indicator');
                if (loadingEl) loadingEl.remove();
                var footer = document.createElement('div');
                footer.className = 'footer-end';
                footer.innerHTML = '<div class="footer-line"></div><div class="footer-icon"><i class="fas fa-check-circle"></i></div><div class="footer-text">已全部加载完成 <span>·</span> 共 <span id="footerTotalCount">' + allData.length + '</span> 张壁纸</div><div class="footer-sub">— 感谢使用 Bing Wallpaper，由小史先生维护提供技术支持！ —</div>';
                grid.appendChild(footer);
            }

            function loadMore() {
                if (isLoading || !hasMore) return;
                var data = filteredData.length > 0 ? filteredData : allData;
                var total = Math.ceil(data.length / PAGE_SIZE);
                if (currentPage >= total) { hasMore = false; showFooterEnd(); return; }
                isLoading = true;
                var nextPage = currentPage + 1;
                var loadingEl = document.getElementById('loadingIndicator');
                if (loadingEl) loadingEl.innerHTML = '<i class="fas fa-spinner"></i> 加载中...';
                renderPage(nextPage);
                setTimeout(function() { isLoading = false; }, 300);
            }

            function checkScroll() {
                if (grid.scrollTop > 500) backToTop.classList.add('visible');
                else backToTop.classList.remove('visible');
                if (grid.scrollHeight - grid.scrollTop - grid.clientHeight < 300) loadMore();
            }

            if (backToTop) backToTop.addEventListener('click', function() { grid.scrollTo({ top: 0, behavior: 'smooth' }); });
            grid.addEventListener('scroll', checkScroll);

            function showEmpty() { grid.innerHTML = '<div class="empty"><div class="icon"><i class="fas fa-image"></i></div><div>暂无壁纸数据</div></div>'; }

            // ---- 搜索 ----
            function doSearch() {
                var keyword = searchInput.value.trim().toLowerCase();
                searchClear.classList.toggle('visible', searchInput.value.length > 0);
                if (!keyword) { filteredData = []; grid.innerHTML = ''; currentPage = 1; hasMore = true; isLoading = false; renderPage(1); return; }
                filteredData = allData.filter(function(item) {
                    var copyright = (item.copyright || '').toLowerCase();
                    var title = (item.title || '').toLowerCase();
                    var date = item.date || '';
                    return copyright.indexOf(keyword) !== -1 || title.indexOf(keyword) !== -1 || date.indexOf(keyword) !== -1 || date.replace(/-/g, '').indexOf(keyword) !== -1;
                });
                if (filteredData.length === 0) { grid.innerHTML = '<div class="empty"><div class="icon"><i class="fas fa-search"></i></div><div>没有匹配"' + keyword + '"的壁纸</div></div>'; return; }
                grid.innerHTML = ''; currentPage = 1; hasMore = true; isLoading = false; totalPages = Math.ceil(filteredData.length / PAGE_SIZE); renderPage(1);
            }
            function clearSearch() { searchInput.value = ''; searchClear.classList.remove('visible'); doSearch(); searchInput.focus(); }
            if (searchBtn) searchBtn.addEventListener('click', doSearch);
            if (searchInput) {
                searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doSearch(); });
                searchInput.addEventListener('input', function() { searchClear.classList.toggle('visible', this.value.length > 0); });
            }
            if (searchClear) searchClear.addEventListener('click', clearSearch);

            // ============================================================
            // 大图预览
            // ============================================================

            function applyToolbarVisibility(visible) {
                toolbarVisible = visible;
                var elements = [toolbar, infoPanel];
                for (var i = 0; i < elements.length; i++) {
                    if (elements[i]) {
                        elements[i].style.transition = 'opacity 0.3s ease';
                        elements[i].style.opacity = visible ? '1' : '0';
                        elements[i].style.pointerEvents = visible ? '' : 'none';
                    }
                }
            }

            function toggleToolbar() {
                applyToolbarVisibility(!toolbarVisible);
            }

            function openPreview(index) {
                if (!allData || allData.length === 0) return;
                if (index < 0) index = allData.length - 1;
                if (index >= allData.length) index = 0;
                currentPreviewIndex = index;
                currentPreviewItem = allData[currentPreviewIndex];
                resetZoom();
                showPreview(currentPreviewIndex);
                previewOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                var imgSrc = currentPreviewItem.urls.fhd || '';
                previewOverlay.style.setProperty('--bg-url', 'url(' + imgSrc + ')');
                applyToolbarVisibility(true);
                previewImg.onclick = function(e) {
                    e.stopPropagation();
                    toggleToolbar();
                };
                var touchStartX = 0, touchStartY = 0;
                previewImg.ontouchstart = function(e) {
                    var touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                };
                previewImg.ontouchend = function(e) {
                    if (touchStartX === 0) return;
                    var touch = e.changedTouches[0];
                    var deltaX = touch.clientX - touchStartX;
                    var deltaY = touch.clientY - touchStartY;
                    if (Math.abs(deltaX) > 30 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
                        if (deltaX > 0) showPreview(currentPreviewIndex - 1);
                        else showPreview(currentPreviewIndex + 1);
                    }
                    touchStartX = 0;
                    touchStartY = 0;
                };
            }

            function showPreview(index) {
                if (allData.length === 0) return;
                if (index < 0) index = allData.length - 1;
                if (index >= allData.length) index = 0;
                currentPreviewIndex = index;
                currentPreviewItem = allData[currentPreviewIndex];
                var isMobile = window.innerWidth < 768;
                var isHistory = currentPreviewItem.isHistory || false;
                var imgSrc;

                if (isMobile) {
                    if (isHistory) {
                        imgSrc = currentPreviewItem.urls.fhd || currentPreviewItem.urls.uhd || '';
                    } else {
                        imgSrc = currentPreviewItem.urls.mobile_s || currentPreviewItem.urls.fhd || '';
                    }
                } else {
                    imgSrc = currentPreviewItem.urls.fhd || '';
                }

                previewImg.src = imgSrc;
                previewImg.onerror = function() {
                    var currentSrc = this.src;
                    if (currentSrc === currentPreviewItem.urls.fhd && currentPreviewItem.urls.hd) { this.src = currentPreviewItem.urls.hd; }
                    else if (currentSrc === currentPreviewItem.urls.hd && currentPreviewItem.urls.uhd) { this.src = currentPreviewItem.urls.uhd; }
                    else { this.alt = '图片加载失败'; }
                };
                previewCopyright.textContent = currentPreviewItem.copyright || '';
                previewDate.textContent = currentPreviewItem.date || '';
                previewDesc.textContent = currentPreviewItem.title || '';
                previewOverlay.style.setProperty('--bg-url', 'url(' + imgSrc + ')');
                resetZoom();
                applyToolbarVisibility(toolbarVisible);
            }

            function closePreview() {
                previewOverlay.classList.remove('active');
                document.body.style.overflow = 'auto';
                applyToolbarVisibility(true);
            }

            if (prevBtn) prevBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                showPreview(currentPreviewIndex - 1);
            });
            if (nextBtn) nextBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                showPreview(currentPreviewIndex + 1);
            });

            document.addEventListener('keydown', function(e) {
                if (!previewOverlay.classList.contains('active')) return;
                if (e.key === 'Escape') closePreview();
                if (e.key === 'ArrowLeft') { e.preventDefault(); showPreview(currentPreviewIndex - 1); }
                if (e.key === 'ArrowRight') { e.preventDefault(); showPreview(currentPreviewIndex + 1); }
            });

            if (previewOverlay) previewOverlay.addEventListener('click', function(e) {
                if (e.target === previewOverlay) closePreview();
            });
            if (closePreviewBtn) closePreviewBtn.addEventListener('click', closePreview);

            // ---- 缩放 ----
            var scale = 1, minScale = 0.3, maxScale = 5, translateX = 0, translateY = 0;
            var isDragging = false, startX = 0, startY = 0, lastTranslateX = 0, lastTranslateY = 0;
            function updateTransform() { previewImg.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')'; }
            function resetZoom() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }
            function startDrag(e) {
                if (scale <= 1) return;
                isDragging = true;
                var pos = e.type === 'mousedown' ? e : e.touches[0];
                startX = pos.clientX;
                startY = pos.clientY;
                lastTranslateX = translateX;
                lastTranslateY = translateY;
                previewImg.style.cursor = 'grabbing';
            }
            function moveDrag(e) {
                if (!isDragging) return;
                e.preventDefault();
                var pos = e.type === 'mousemove' ? e : e.touches[0];
                translateX = lastTranslateX + pos.clientX - startX;
                translateY = lastTranslateY + pos.clientY - startY;
                updateTransform();
            }
            function endDrag() { isDragging = false; previewImg.style.cursor = 'grab'; }
            function wheelZoom(e) { e.preventDefault(); var delta = e.deltaY > 0 ? -0.15 : 0.15; scale = Math.min(Math.max(scale + delta, minScale), maxScale); if (scale <= 1) { translateX = 0; translateY = 0; } updateTransform(); }
            if (previewImg) {
                previewImg.addEventListener('mousedown', startDrag);
                document.addEventListener('mousemove', moveDrag);
                document.addEventListener('mouseup', endDrag);
                previewImg.addEventListener('touchstart', startDrag, { passive: true });
                document.addEventListener('touchmove', moveDrag, { passive: false });
                document.addEventListener('touchend', endDrag, { passive: true });
                previewImg.addEventListener('wheel', wheelZoom, { passive: false });
            }

            // ---- 下载 ----
            function getDownloadFileName(item, resolution) {
                var urlbase = item.urlbase || '';
                var rawName = '';
                if (urlbase) {
                    var match = urlbase.match(/[^/]+$/);
                    if (match) {
                        rawName = match[0];
                        if (rawName.startsWith('th?id=')) {
                            rawName = rawName.replace('th?id=', '');
                        }
                    }
                }
                if (rawName) {
                    var resMap = { '4k': 'UHD', 'fhd': '1920x1080', 'hd': '1366x768', 'mobile': '1080x1920', 'mobile_s': '768x1280' };
                    var resSuffix = resMap[resolution] || 'UHD';
                    var cleanName = rawName.replace(/_(UHD|1920x1080|1080x1920|1366x768|768x1280|400x240)$/i, '');
                    return cleanName + '_' + resSuffix + '.jpg';
                }
                return 'wallpaper_' + (item.date || Date.now()) + '_' + resolution + '.jpg';
            }

            function downloadBlob(blob, fileName) {
                var url = URL.createObjectURL(blob);
                var link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
                console.log('✅ 下载成功: ' + fileName);
            }

            function cropToMobile(blob, fileName, resolution) {
                return new Promise(function(resolve, reject) {
                    var img = new Image();
                    var url = URL.createObjectURL(blob);
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var ctx = canvas.getContext('2d');
                        var targetW = resolution === 'mobile_s' ? 768 : 1080;
                        var targetH = resolution === 'mobile_s' ? 1280 : 1920;
                        canvas.width = targetW;
                        canvas.height = targetH;
                        var imgW = img.width, imgH = img.height;
                        var targetRatio = targetW / targetH;
                        var cropW, cropH, cropX, cropY;
                        if (imgW / imgH > targetRatio) {
                            cropH = imgH;
                            cropW = imgH * targetRatio;
                            cropX = (imgW - cropW) / 2;
                            cropY = 0;
                        } else {
                            cropW = imgW;
                            cropH = imgW / targetRatio;
                            cropX = 0;
                            cropY = (imgH - cropH) / 2;
                        }
                        ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, targetW, targetH);
                        canvas.toBlob(function(croppedBlob) {
                            if (croppedBlob) {
                                downloadBlob(croppedBlob, fileName);
                                resolve();
                            } else { reject('裁剪失败'); }
                        }, 'image/jpeg', 0.92);
                        URL.revokeObjectURL(url);
                    };
                    img.onerror = function() {
                        console.warn('⚠️ 图片加载失败，直接下载原图');
                        downloadBlob(blob, fileName);
                        resolve();
                    };
                    img.src = url;
                });
            }

            function downloadImage(index, resolution) {
                if (!allData || allData.length === 0) return;
                var item = allData[index];
                if (!item) return;
                var fileName = getDownloadFileName(item, resolution);
                var isHistory = item.isHistory || false;
                var isMobileRes = (resolution === 'mobile' || resolution === 'mobile_s');
                var url = getImageUrl(item, resolution);
                if (!url) { console.warn('⚠️ 无效的下载地址'); return; }

                function tryDownload(downloadUrl) {
                    fetch(downloadUrl, { mode: 'cors' })
                        .then(function(response) {
                            if (!response.ok) throw new Error('网络请求失败');
                            return response.blob();
                        })
                        .then(function(blob) {
                            if (isMobileRes) {
                                if (isHistory) {
                                    cropToMobile(blob, fileName, resolution);
                                } else {
                                    downloadBlob(blob, fileName);
                                }
                            } else {
                                downloadBlob(blob, fileName);
                            }
                        })
                        .catch(function(err) {
                            console.warn('⚠️ 下载失败，直接打开:', err.message);
                            var link = document.createElement('a');
                            link.href = downloadUrl;
                            link.download = fileName;
                            link.target = '_blank';
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        });
                }
                tryDownload(url);
            }

            var downloadMenu = document.getElementById('downloadMenu');
            if (downloadMenu) {
                downloadMenu.querySelectorAll('a').forEach(function(item) {
                    item.addEventListener('click', function(e) {
                        e.preventDefault();
                        var res = this.getAttribute('data-res');
                        downloadImage(currentPreviewIndex, res);
                    });
                });
            }

            // ---- 启动 ----
            loadData();
            console.log('✅ 导航栏已升级：默认隐藏，鼠标移入顶部显示');
            console.log('✅ 移动端：搜索框 + 汉堡按钮已显示');
            console.log('✅ 壁纸统计已添加');
            console.log('✅ 数据源已改为 /data/data.json');
            console.log('✅ 历史链接已移除');
            window.openComment = openComment;
        })();
    </script>
